name: Backend CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f53f5227a9e83886ab598c617f3c170fab62f0d3 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:test:integration
        env:
          AO_SESSION_ID: ci-db-${{ github.run_id }}-${{ github.run_attempt }}
      - run: pnpm test:e2e
      - run: pnpm build
      - name: Install Playwright Chromium for the FE+BE browser smoke
        run: pnpm --filter @tpa/workbench exec playwright install --with-deps chromium
      - run: pnpm test:smoke
      - name: Upload FE+BE smoke evidence (screenshots, Playwright report)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workbench-smoke-evidence
          path: |
            apps/workbench/test-results/
            apps/workbench/playwright-report/
          if-no-files-found: warn
          retention-days: 14
