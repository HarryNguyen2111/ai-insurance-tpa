name: AI Worker CI
on:
  push:
    branches: [main]
    paths:
      - services/ai-worker/**
      - .github/workflows/ai-worker.yml
  pull_request:
    paths:
      - services/ai-worker/**
      - .github/workflows/ai-worker.yml
permissions:
  contents: read
jobs:
  ai-worker-typecheck-test:
    name: ai-worker typecheck + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/ai-worker
    env:
      UV_PYTHON_DOWNLOADS: never
      # pyzbar must load the real libzbar in CI; locally a missing lib is a skip.
      AI_WORKER_REQUIRE_ZBAR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: services/ai-worker/.python-version
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          enable-cache: true
          cache-dependency-glob: services/ai-worker/uv.lock
      - name: Install system zbar library for pyzbar
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libzbar0
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Typecheck (mypy --strict)
        run: uv run --frozen mypy
      - name: Test (pytest, synthetic image fixtures)
        run: uv run --frozen pytest
