          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 100
          uniqueItems: true
        payeeSnapshot:
          $ref: '#/components/schemas/VersionedReference'
        semanticPayoutKey:
          $ref: '#/components/schemas/IdempotencyKeyValue'
      description: Core derives immutable amount/currency/payee from current approved EOB and authorized payee snapshot.
        Caller cannot assert bank/amount. Lock/check valid signature, required maker-checker/originals, reservations
        and funds. Semantic key uniqueness outlives transport key. UNKNOWN blocks new payout; failed retry only
        after definitive non-success evidence.
    PaymentStatus:
      type: string
      enum:
      - CREATED
      - SUBMITTED
      - UNKNOWN
      - SUCCEEDED
      - FAILED
    PaymentIntent:
      type: object
      additionalProperties: false
      required:
      - paymentId
      - claimId
      - aggregateVersion
      - eob
      - amount
      - currency
      - payeeSnapshot
      - semanticPayoutKey
      - status
      - createdAt
      - updatedAt
      - auditProof
      properties:
        attemptId:
          type: string
          format: uuid
          description: Server-created stable non-PII identifier of the applicable payment attempt. Returned by authorized payment reads for every state after CREATED; use this exact reference in reconciliation. Never regenerate it on retries or UNKNOWN timeout. Core verifies it belongs to this payment and current obligation; stale or mismatched attempt returns 409 STALE_VERSION.
        paymentId:
          type: string
          format: uuid
        claimId:
          type: string
          format: uuid
        aggregateVersion:
          $ref: '#/components/schemas/VersionNumber'
        eob:
          $ref: '#/components/schemas/EobBinding'
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
          enum:
          - VND
        payeeSnapshot:
          $ref: '#/components/schemas/VersionedReference'
        semanticPayoutKey:
          $ref: '#/components/schemas/IdempotencyKeyValue'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        journalId:
          type: string
          format: uuid
        auditProof:
          $ref: '#/components/schemas/AuditProof'
      oneOf:
      - properties:
          status:
            type: string
            enum: [CREATED]
      - required: [attemptId]
        properties:
          attemptId:
            type: string
            format: uuid
          status:
            type: string
            enum: [SUBMITTED, UNKNOWN, SUCCEEDED, FAILED]
      description: CREATED -> SUBMITTED -> SUCCEEDED|FAILED|UNKNOWN. Timeout UNKNOWN never blind retry. Only authenticated
        evidence-backed callback/query/reconciliation resolves UNKNOWN. PAID only after definitive success with
        balanced journal + audit + reservation consumption + outbox atomically. POSTED journals immutable, corrections
        only by new balanced reversal referencing original; no UPDATE/DELETE. Payee/amount locked after approval/submission.
    PaymentCallback:
      type: object
      additionalProperties: false
      required:
      - schemaVersion
      - eventId
      - paymentId
      - attemptId
      - expectedAggregateVersion
      - occurredAt
      - status
      - evidenceReference
      properties:
