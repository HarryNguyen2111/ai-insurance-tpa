  /internal/v1/webhooks/ai-result:
    post:
      operationId: receiveAiResult
      summary: Accept authenticated versioned AI proposal
      description: Ingress mTLS/service identity AND HMAC-SHA256 required. Sign UTF-8 timestamp + newline + event
        ID + newline + exact raw body bytes; lowercase hex digest, constant-time comparison. Reject timestamps outside
        +/-300 seconds (including future), invalid signature 401, untrusted service 403. Header/body eventId must
        match. Dedup by verified service/run/event ID plus raw-body hash; changed payload 409. Tenant resolved from
        authorized extraction run; check expected claim version and referenced evidence. Duplicate in replay window
        returns durable original acknowledgement; expired signed replay rejected 401 even if previously seen. Key
        rotation/identity trust deployment blocked until approved.
      parameters:
      - in: header
        name: X-Signature-HMAC
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{64}$
      - in: header
        name: X-Event-Id
        required: true
        schema:
          type: string
          format: uuid
      - in: header
        name: X-Signature-Timestamp
        required: true
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiAcknowledgement'
          headers:
            Cache-Control:
              description: Must be no-store for sensitive data
              schema:
                type: string
                enum:
