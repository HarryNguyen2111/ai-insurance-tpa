        occurredAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - SUCCEEDED
          - FAILED
          - UNKNOWN
        evidenceReference:
          type: string
          minLength: 1
          maxLength: 200
      description: Generic internal adapter contract, NOT bank wire format. Verified service maps payment/attempt
        to tenant and verifies evidence against submitted amount/payee/semantic key. No caller tenant/raw bank/PII.
        Stale/out-of-order/conflicting terminal updates 409 then reconcile; never downgrade success. Actual bank
        contract pending.
