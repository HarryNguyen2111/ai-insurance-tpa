          $ref: '#/components/schemas/VersionNumber'
        eob:
          $ref: '#/components/schemas/EobBinding'
        signatureId:
          type: string
          format: uuid
        approvalDecisionIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 0
          maxItems: 100
          uniqueItems: true
