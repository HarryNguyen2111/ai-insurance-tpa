    post:
      operationId: exchangeZaloIdentity
      summary: Exchange verified Zalo identity
      description: 'BLOCKED pending provider evidence: code, PKCE, state and redirect semantics are adapter proposals,
        not a claim of Zalo support. Fail closed 503 PROVIDER_NOT_CONFIGURED until approved. Verify upstream identity
        server-side; rate-limit; no client-asserted tenant. Idempotency scoped to verified exchange transaction;
        never log code/tokens.'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
          headers:
            Cache-Control:
              description: Must be no-store for sensitive data
