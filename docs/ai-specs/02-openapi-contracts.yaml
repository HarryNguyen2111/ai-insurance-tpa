        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiResult'
      security:
      - internalHmac: []
  /v1/policies/{policyId}/versions:
    post:
      operationId: createPolicyVersion
      summary: Create policy version
      description: 'Authorized policy administrator with MFA; exact approved source clauses, dates and precedence.
        Server verifies principal, active membership and object permissions; conceal inaccessible objects 404, action
        denied 403. Revalidate on replay; no-store. Durable tenant/actor/operation/key canonical hash: same body
        returns original, changed body 409 IDEMPOTENCY_CONFLICT; in-progress 409 with Retry-After. Retention >=24h
        never permits duplicate semantic side effects. Business state + audit + outbox atomic in withTenantTransaction
        using SET LOCAL/RLS. Stale aggregate/EOB version/hash 409 STALE_VERSION.'
      parameters:
      - in: path
        name: policyId
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/MembershipContext'
