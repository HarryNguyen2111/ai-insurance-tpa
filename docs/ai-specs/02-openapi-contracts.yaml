          - LIGHT
          - BRAND
      description: Closed allowlist only; no CSS, font, HTML or URL. Contrast never rejects (decided OD-WS1).
    WorkspaceCreateRequest:
      type: object
      additionalProperties: false
      required:
      - displayName
      - shortName
      - slug
      - orgType
      - initialAdminPrincipalId
      properties:
        displayName:
          $ref: '#/components/schemas/WorkspaceDisplayName'
        shortName:
          $ref: '#/components/schemas/WorkspaceShortName'
        slug:
          $ref: '#/components/schemas/WorkspaceSlug'
        orgType:
          $ref: '#/components/schemas/WorkspaceOrgType'
        description:
          $ref: '#/components/schemas/WorkspaceDescription'
        theme:
          $ref: '#/components/schemas/WorkspaceTheme'
        initialAdminPrincipalId:
          type: string
          format: uuid
      description: TPA operations only (decided OD-05). initialAdminPrincipalId must be an existing verified principal
        and receives WORKSPACE_ADMIN. Absent theme means the platform default theme. No tenant ID field.
    WorkspaceProfileUpdateRequest:
      type: object
      additionalProperties: false
      required:
      - expectedVersion
      - displayName
      - shortName
      - orgType
      properties:
        expectedVersion:
          $ref: '#/components/schemas/VersionNumber'
        displayName:
          $ref: '#/components/schemas/WorkspaceDisplayName'
        shortName:
          $ref: '#/components/schemas/WorkspaceShortName'
        orgType:
          $ref: '#/components/schemas/WorkspaceOrgType'
        description:
          $ref: '#/components/schemas/WorkspaceDescription'
      description: Full replacement; absent description clears it. Slug is not editable here (decided OD-02).
    WorkspaceThemeUpdateRequest:
      type: object
      additionalProperties: false
      required:
      - expectedVersion
      - theme
      properties:
        expectedVersion:
          $ref: '#/components/schemas/VersionNumber'
        theme:
          $ref: '#/components/schemas/WorkspaceTheme'
    WorkspaceLogoActivateRequest:
      type: object
      additionalProperties: false
      required:
      - expectedVersion
      - logoAssetId
      properties:
        expectedVersion:
          $ref: '#/components/schemas/VersionNumber'
        logoAssetId:
          type: string
          format: uuid
    WorkspaceLogoClearRequest:
      type: object
      additionalProperties: false
      required:
      - expectedVersion
      - clear
      properties:
        expectedVersion:
          $ref: '#/components/schemas/VersionNumber'
        clear:
          type: boolean
          enum:
          - true
    WorkspaceLogoSetRequest:
      oneOf:
      - $ref: '#/components/schemas/WorkspaceLogoActivateRequest'
      - $ref: '#/components/schemas/WorkspaceLogoClearRequest'
    WorkspaceLogoMime:
      type: string
      enum:
      - image/png
      - image/jpeg
      - image/webp
      description: SVG is never accepted because it can carry executable content.
    WorkspaceLogo:
      type: object
      additionalProperties: false
      required:
      - assetId
      - mime
      - width
      - height
      - previewUrl
      - previewUrlExpiresAt
      properties:
        assetId:
          type: string
          format: uuid
        mime:
          $ref: '#/components/schemas/WorkspaceLogoMime'
        width:
          type: integer
          minimum: 1
          maximum: 512
        height:
          type: integer
          minimum: 1
          maximum: 512
        previewUrl:
          type: string
          format: uri
          pattern: ^https://
        previewUrlExpiresAt:
          type: string
          format: date-time
      description: Active re-encoded derivative. Private signed preview URL expires in at most 300 seconds; never
        logged or put in events.
    Workspace:
      type: object
      additionalProperties: false
      required:
      - workspaceId
      - slug
      - displayName
      - shortName
      - orgType
      - theme
      - version
      - createdAt
      - updatedAt
      properties:
        workspaceId:
          type: string
          format: uuid
        slug:
          $ref: '#/components/schemas/WorkspaceSlug'
        displayName:
          $ref: '#/components/schemas/WorkspaceDisplayName'
        shortName:
          $ref: '#/components/schemas/WorkspaceShortName'
        orgType:
          $ref: '#/components/schemas/WorkspaceOrgType'
        description:
          $ref: '#/components/schemas/WorkspaceDescription'
        theme:
          $ref: '#/components/schemas/WorkspaceTheme'
        logo:
          $ref: '#/components/schemas/WorkspaceLogo'
        version:
          $ref: '#/components/schemas/VersionNumber'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      description: Absent description or logo means none. No tenant ID is exposed.
    WorkspaceWarning:
      type: object
      additionalProperties: false
      required:
      - code
      - messageVi
      - contrastRatio
      properties:
        code:
          type: string
          enum:
          - LOW_SURFACE_CONTRAST
        messageVi:
          type: string
          minLength: 1
          maxLength: 500
        contrastRatio:
          type: number
          minimum: 1
          maximum: 21
      description: Advisory only (decided OD-WS1); the mutation is committed.
    WorkspaceResult:
      type: object
      additionalProperties: false
      required:
      - workspace
      - warnings
      properties:
        workspace:
          $ref: '#/components/schemas/Workspace'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceWarning'
          minItems: 0
          maxItems: 5
    WorkspaceLogoUploadRequest:
      type: object
      additionalProperties: false
      required:
      - contentType
      - sizeBytes
      - sha256
      properties:
        contentType:
          $ref: '#/components/schemas/WorkspaceLogoMime'
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 2097152
        sha256:
          $ref: '#/components/schemas/Hash'
      description: 2 MiB raw technical maximum; no file name or object key accepted.
    WorkspaceLogoUploadHeaders:
      type: object
      additionalProperties: false
      required:
      - Content-Type
      - x-amz-checksum-sha256
      properties:
        Content-Type:
          $ref: '#/components/schemas/WorkspaceLogoMime'
        x-amz-checksum-sha256:
          type: string
          pattern: ^[A-Za-z0-9+/]{43}=$
    WorkspaceLogoUploadGrant:
      type: object
      additionalProperties: false
      required:
      - assetId
      - uploadUrl
      - method
      - expiresAt
      - requiredHeaders
      properties:
        assetId:
          type: string
          format: uuid
        uploadUrl:
          type: string
          format: uri
          pattern: ^https://
        method:
          type: string
          enum:
          - PUT
        expiresAt:
          type: string
          format: date-time
        requiredHeaders:
          $ref: '#/components/schemas/WorkspaceLogoUploadHeaders'
      description: Expires in at most 300 seconds; private quarantine location; URL/header secrets never logged.
    WorkspaceLogoAssetPending:
      type: object
      additionalProperties: false
      required:
      - assetId
      - state
      - createdAt
      properties:
        assetId:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - PENDING_UPLOAD
          - PROCESSING
        createdAt:
          type: string
          format: date-time
    WorkspaceLogoAssetReady:
      type: object
      additionalProperties: false
      required:
      - assetId
      - state
      - mime
      - width
      - height
      - createdAt
      properties:
        assetId:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - READY
        mime:
          $ref: '#/components/schemas/WorkspaceLogoMime'
        width:
          type: integer
          minimum: 1
          maximum: 512
        height:
          type: integer
          minimum: 1
          maximum: 512
        createdAt:
          type: string
          format: date-time
    WorkspaceLogoAssetRejected:
      type: object
      additionalProperties: false
      required:
      - assetId
      - state
      - rejectionCode
      - createdAt
      properties:
        assetId:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - REJECTED
        rejectionCode:
          type: string
          enum:
          - SVG_NOT_ALLOWED
          - UNSUPPORTED_TYPE
          - TYPE_MISMATCH
          - CHECKSUM_MISMATCH
          - TOO_LARGE
          - DIMENSIONS_OUT_OF_RANGE
          - ASPECT_RATIO_OUT_OF_RANGE
          - DECODE_FAILED
          - SCAN_FAILED
        createdAt:
          type: string
          format: date-time
    WorkspaceLogoAsset:
      oneOf:
      - $ref: '#/components/schemas/WorkspaceLogoAssetPending'
      - $ref: '#/components/schemas/WorkspaceLogoAssetReady'
      - $ref: '#/components/schemas/WorkspaceLogoAssetRejected'
    WorkspaceChangedEvent:
      type: object
      additionalProperties: false
      required:
      - eventId
      - eventType
      - schemaVersion
      - tenantId
      - aggregateId
      - aggregateVersion
      - occurredAt
      - correlationId
      - causationId
      - payload
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          enum:
          - workspace.changed
        schemaVersion:
          type: string
          enum:
          - 1.0.0
        tenantId:
          type: string
          format: uuid
        aggregateId:
          type: string
          format: uuid
        aggregateVersion:
          $ref: '#/components/schemas/VersionNumber'
        occurredAt:
          type: string
          format: date-time
        correlationId:
          type: string
          format: uuid
        causationId:
          type: string
          format: uuid
        payload:
          type: object
          additionalProperties: false
          required:
          - changeKind
          properties:
            changeKind:
              type: string
              enum:
              - CREATED
              - PROFILE
              - THEME
              - LOGO
      description: Internal outbox envelope; tenantId derived by trusted core, aggregateId is the workspaceId. Payload
        carries no names, slugs, colours, images or URLs; consumers reload the authorized resource. Inbox dedup and
        aggregate version ordering required.
