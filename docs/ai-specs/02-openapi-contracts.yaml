openapi: 3.0.3
info:
  title: MPS TPA Core & AI Worker API Contracts
  version: 1.3.0
  description: Hop dong giao tiep chuan giua Zalo Mini App, Next.js Workbench, NestJS Core API va Python AI Worker.

# Contract nền: endpoint mới liệt kê trong 07 phải được đặc tả đầy đủ trước implementation.
# Bearer token phải được xác minh issuer/audience/expiry/membership phía server.
security:
  - bearerAuth: []
x-platform-requirements:
  architecture: 06-backend-platform-architecture.md
  domain: 07-domain-data-and-api-requirements.md
  acceptance: 08-delivery-and-acceptance.md
  tenantSource: verified-principal-membership
  idempotency: same-key-different-payload-returns-409

# API-C1 technical proposals; deployment/provider approval is not implied.
# Public tenant context comes only from verified principal + active server-issued membership.
# Sensitive mutations: tenant/actor/operation/key scoped durable request hash; retention >=24h.
# Same key/body returns original status/body; different body 409; concurrent in-progress 409 + Retry-After.
# Revalidate authorization on replay; expired key must not blindly repeat semantic side effects.
# All responses with tokens/identity/documents/claims use Cache-Control: no-store.
x-domain-events:
  EobPublishedEvent:
    $ref: '#/components/schemas/EobPublishedEvent'
  PaymentStatusChangedEvent:
    $ref: '#/components/schemas/PaymentStatusChangedEvent'
  CatalogProposalReviewedEvent:
    $ref: '#/components/schemas/CatalogProposalReviewedEvent'
  WorkspaceChangedEvent:
    $ref: '#/components/schemas/WorkspaceChangedEvent'

