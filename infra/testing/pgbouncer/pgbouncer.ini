; Synthetic test only. Database host is the test network alias, never the host DB.
[databases]
tpa = host=database port=5432 dbname=tpa
[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =
auth_type = scram-sha-256
auth_file = /config/userlist.txt
pool_mode = transaction
default_pool_size = 1
reserve_pool_size = 0
max_db_connections = 1
max_client_conn = 40
; Do NOT mask tenant leaks using DISCARD ALL after every transaction.
server_reset_query_always = 0
server_lifetime = 3600
server_idle_timeout = 0
query_wait_timeout = 15
log_connections = 0
log_disconnections = 0
